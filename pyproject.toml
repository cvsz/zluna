[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zluna"
version = "2.0.0"
description = "ZLUNA (Lunaland Next-Gen) Enterprise Social Casino Simulator & Realtime Platform"
readme = "README.md"
authors = [{ name = "cvsz", email = "seaza@msn.com" }]
license = { text = "ISC" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment :: Simulation",
]
keywords = ["casino-simulator", "provably-fair", "luckystreak", "lunaland", "enterprise"]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://zluna.zeaz.dev"
Repository = "https://github.com/cvsz/zluna"
Issues = "https://github.com/cvsz/zluna/issues"

[tool.setuptools.packages.find]
where = ["src"]
